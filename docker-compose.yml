version: "3.8"

services:
  api:
    build:
      context: ./workshop-api
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=file:/app/data/prod.db
      - JWT_SECRET=${JWT_SECRET:-super-secret-change-me}
      - PORT=4000
    volumes:
      - api-data:/app/data

  frontend:
    build:
      context: ./workshop-cli
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  api-data:
